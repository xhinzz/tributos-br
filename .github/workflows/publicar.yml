name: publicar

# tag vX.Y.Z -> PyPI, por trusted publishing (sem token guardado)
on:
  push:
    tags: ["v*"]

jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - name: a tag bate com a versão do pacote
        run: test "v$(python -c 'import tributos_br; print(tributos_br.__version__)')" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: pacote
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tributos-br
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
